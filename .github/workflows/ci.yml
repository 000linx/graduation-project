name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pip-audit
      - name: Security audit
        run: pip-audit -r backend/requirements.txt --ignore-vuln PYSEC-2024-271 --ignore-vuln PYSEC-2025-183
      - name: Test + coverage
        working-directory: backend
        run: python -m pytest -q --cov=app --cov-config=.coveragerc --cov-report=xml:coverage.xml --cov-report=term-missing
      - uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Format check
        working-directory: frontend
        run: npm run format:check
      - name: Stylelint
        working-directory: frontend
        run: npm run lint:css
      - name: Test + coverage
        working-directory: frontend
        run: npm run test:coverage
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Security audit
        working-directory: frontend
        run: npm audit --audit-level=high
      - name: Lighthouse
        working-directory: frontend
        env:
          LH_MIN_PERFORMANCE: "0.6"
          LH_MIN_ACCESSIBILITY: "0.6"
          LH_MIN_BEST_PRACTICES: "0.6"
          LH_MIN_SEO: "0.6"
        run: |
          npm exec -- http-server dist -p 4177 --gzip --brotli --silent &
          SERVER_PID=$!
          trap "kill $SERVER_PID" EXIT
          npm exec -- lighthouse http://127.0.0.1:4177/ --preset=desktop --only-categories=performance,accessibility,best-practices,seo --output=json --output-path=lighthouse-report.json --quiet --no-enable-error-reporting
          node tools/assert-lighthouse.mjs lighthouse-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-artifacts
          path: |
            frontend/coverage/**
            frontend/lighthouse-report.json
            frontend/lh-scores.json
