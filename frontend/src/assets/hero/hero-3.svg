<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="主视觉背景 3">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d4ed8" />
      <stop offset="1" stop-color="#22c55e" />
    </linearGradient>
    <radialGradient id="r" cx="55%" cy="35%" r="75%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" />
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#g)" />
  <rect width="1600" height="900" fill="url(#r)" />
  <g filter="url(#blur)" opacity="0.35">
    <circle cx="300" cy="240" r="140" fill="#ffffff" />
    <circle cx="520" cy="320" r="200" fill="#ffffff" />
    <circle cx="1180" cy="520" r="220" fill="#ffffff" />
    <circle cx="1320" cy="380" r="160" fill="#ffffff" />
  </g>
</svg>

